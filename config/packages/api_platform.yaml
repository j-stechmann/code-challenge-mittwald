api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    exception_to_status:
        # Backstop for ON DELETE RESTRICT, e.g. a device assigned while its cabinet is being deleted.
        Doctrine\DBAL\Exception\ForeignKeyConstraintViolationException: 409
